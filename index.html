
<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SlidCard — Вхід</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html,body { height: 100%; background: #080A0F; color: #F0F4FF; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
/* ═══════════════════════════════════════════════════════════
   SlidCard v3.0 — Premium Dark Design System
   Palette: Deep black + Electric cyan accent
   ═══════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap');

:root { /*auth*/
  /* Core palette */
  --bg:          #080A0F;
  --bg2:         #0D1017;
  --surface:     #111520;
  --surface2:    #161C2C;
  --surface3:    #1C2338;
  --border:      rgba(255,255,255,.06);
  --border2:     rgba(255,255,255,.10);
  --border3:     rgba(255,255,255,.16);

  /* Cyan accent system */
  --cyan:        #00D4FF;
  --cyan2:       #00A8CC;
  --cyan3:       #007A99;
  --cyan-glow:   rgba(0,212,255,.15);
  --cyan-dim:    rgba(0,212,255,.08);

  /* Text */
  --text:        #F0F4FF;
  --text2:       #A8B4CC;
  --text3:       #6B7A99;
  --dim:         #4A5568;

  /* Semantic */
  --up:          #00E5A0;
  --down:        #FF4D6A;
  --gold:        #FFB800;
  --gold2:       #CC9200;
  --warn:        #FF8C00;

  /* Rarity hex (unchanged for cards) */
  --c-common:    #7A8595;
  --c-rare:      #4C8DFF;
  --c-epic:      #B15CFF;
  --c-legendary: #F0B429;
  --c-ultimate:  #FF4757;

  /* Typography */
  --font-disp:   'Syne', sans-serif;
  --font-ui:     'Inter', sans-serif;
  --font-mono:   'JetBrains Mono', monospace;

  /* Spacing & shape */
  --r-sm:   6px;
  --r-md:   10px;
  --r-lg:   14px;
  --r-xl:   20px;
  --r-2xl:  28px;

  /* Sidebar */
  --sidebar-w: 220px;
  --topbar-h:  56px;
}

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ── App layout ─────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: relative;
  z-index: 10;
}

.sidebar-brand {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar-brand .brand-name {
  font-family: var(--font-disp);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--text);
}
.sidebar-brand .brand-name span { color: var(--cyan); }
.sidebar-brand .brand-ver {
  font-size: 10px;
  color: var(--dim);
  font-family: var(--font-mono);
  margin-top: 1px;
}

.sidebar-section {
  padding: 0 10px;
  margin-bottom: 4px;
}
.sidebar-section-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--dim);
  padding: 8px 10px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-md);
  color: var(--text3);
  font-size: 13px;
  font-weight: 500;
  transition: all .15s;
  position: relative;
  cursor: pointer;
}
.nav-item:hover {
  background: var(--surface);
  color: var(--text2);
}
.nav-item.active {
  background: var(--cyan-dim);
  color: var(--cyan);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 2px;
  background: var(--cyan);
  border-radius: 0 2px 2px 0;
}
.nav-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  background: var(--surface);
  flex-shrink: 0;
  transition: .15s;
}
.nav-item.active .nav-icon {
  background: rgba(0,212,255,.12);
}
.nav-item:hover .nav-icon {
  background: var(--surface2);
}
.nav-label { flex: 1; }

.sidebar-spacer { flex: 1; }
.sidebar-bottom {
  padding: 10px;
  border-top: 1px solid var(--border);
}
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: .15s;
}
.sidebar-user:hover { background: var(--surface); }
.user-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan2), #6B6BFF);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-disp);
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.user-info { min-width: 0; }
.user-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-id { font-size: 10px; color: var(--dim); font-family: var(--font-mono); }

/* ── TOPBAR ──────────────────────────────────────────────── */
.topbar {
  height: var(--topbar-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
}
.topbar-title {
  font-family: var(--font-disp);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.topbar-spacer { flex: 1; }

/* Balance chip */
.balance-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 6px 14px 6px 10px;
  transition: .15s;
}
.balance-chip:hover { border-color: var(--border3); }
.balance-icon {
  width: 20px;
  height: 20px;
  background: linear-gradient(135deg, #00D4FF, #0066FF);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  font-family: var(--font-mono);
  flex-shrink: 0;
}
.balance-amount {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--up);
  box-shadow: 0 0 6px var(--up);
  animation: livePulse 2s infinite;
}
@keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.tb-clock {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text3);
}

/* ── MAIN CONTENT ────────────────────────────────────────── */
.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.main-content::-webkit-scrollbar { width: 4px; }
.main-content::-webkit-scrollbar-track { background: transparent; }
.main-content::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

/* Ticker */
.ticker-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 32px;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: flex;
  animation: tickerScroll 60s linear infinite;
  white-space: nowrap;
}
@keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 20px;
  font-size: 11px;
  border-right: 1px solid var(--border);
}
.ticker-item .nm { color: var(--text3); }
.ticker-item .up { color: var(--up); font-family: var(--font-mono); font-size: 10px; }
.ticker-item .dn { color: var(--down); font-family: var(--font-mono); font-size: 10px; }

/* ── COMPONENTS ──────────────────────────────────────────── */

/* Page header */
.page-header { margin-bottom: 24px; }
.page-title {
  font-family: var(--font-disp);
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -.02em;
}
.page-sub { font-size: 13px; color: var(--text3); margin-top: 4px; }

/* Cards/panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title {
  font-family: var(--font-disp);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.card-body { padding: 20px; }

/* Stat blocks */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; }
.stat-block {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
}
.stat-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.stat-value { font-family: var(--font-disp); font-size: 22px; font-weight: 800; color: var(--text); }
.stat-value.cyan { color: var(--cyan); }
.stat-value.up { color: var(--up); }
.stat-value.down { color: var(--down); }
.stat-value.gold { color: var(--gold); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  transition: all .15s;
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  font-family: var(--font-ui);
}
.btn-primary {
  background: var(--cyan);
  color: #05080F;
  border-color: var(--cyan);
}
.btn-primary:hover { background: #1ADAFF; box-shadow: 0 0 20px rgba(0,212,255,.3); }
.btn-ghost {
  background: transparent;
  color: var(--text2);
  border-color: var(--border2);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border3); }
.btn-surface {
  background: var(--surface2);
  color: var(--text2);
  border-color: var(--border);
}
.btn-surface:hover { background: var(--surface3); color: var(--text); }
.btn-up { background: rgba(0,229,160,.12); color: var(--up); border-color: rgba(0,229,160,.2); }
.btn-up:hover { background: rgba(0,229,160,.2); }
.btn-down { background: rgba(255,77,106,.12); color: var(--down); border-color: rgba(255,77,106,.2); }
.btn-down:hover { background: rgba(255,77,106,.2); }
.btn-gold { background: rgba(255,184,0,.12); color: var(--gold); border-color: rgba(255,184,0,.2); }
.btn-gold:hover { background: rgba(255,184,0,.2); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 24px; font-size: 14px; }
.btn-sm { padding: 5px 12px; font-size: 11px; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.badge-common    { background:rgba(122,133,149,.15);color:#7A8595 }
.badge-rare      { background:rgba(76,141,255,.15);color:#4C8DFF }
.badge-epic      { background:rgba(177,92,255,.15);color:#B15CFF }
.badge-legendary { background:rgba(240,180,41,.15);color:#F0B429 }
.badge-ultimate  { background:rgba(255,71,87,.15);color:#FF4757 }

/* Chips / filter pills */
.chip {
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text3);
  transition: .12s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--border2); color: var(--text2); }
.chip.active { background: rgba(0,212,255,.1); border-color: var(--cyan); color: var(--cyan); }

/* Inputs */
.input-group { margin-bottom: 14px; }
.input-label { display: block; font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .06em; }
.input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--r-md);
  color: var(--text);
  font-size: 13px;
  padding: 9px 13px;
  outline: none;
  transition: .15s;
  font-family: var(--font-ui);
}
.input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,212,255,.08); }
.input::placeholder { color: var(--dim); }

/* Auth tabs */
.auth-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: var(--r-md); padding: 3px; margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 7px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer; text-align: center; transition: .15s; }
.auth-tab.on { background: var(--surface3); color: var(--text); }
.auth-err { font-size: 11px; color: var(--down); margin: 4px 0; min-height: 16px; }

/* Tables */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text3);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
}
.data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--surface2); }

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,8,15,.8);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r-2xl);
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(0,212,255,.06);
  animation: modalIn .2s ease;
}
.modal-sm { max-width: 400px; }
@keyframes modalIn { from{opacity:0;transform:translateY(16px) scale(.97)} to{opacity:1;transform:none} }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--font-disp); font-size: 16px; font-weight: 700; }
.modal-close { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); color: var(--text3); font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .15s; border: 1px solid var(--border); }
.modal-close:hover { background: var(--surface3); color: var(--text); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

/* Toasts */
#toast-root { position: fixed; top: 16px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  border-radius: var(--r-lg);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  animation: toastIn .25s ease;
  max-width: 320px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
}
.toast.out { animation: toastOut .3s ease forwards; }
.toast-win  { border-color: rgba(0,229,160,.3); }
.toast-lose { border-color: rgba(255,77,106,.3); }
.toast-warn { border-color: rgba(255,184,0,.3); }
.toast-icon { font-size: 16px; }
@keyframes toastIn  { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }
@keyframes toastOut { to{opacity:0;transform:translateX(20px)} }

/* Currency display */
.currency {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-weight: 700;
}
.currency::before {
  content: '$';
  font-size: .8em;
  opacity: .7;
}
.currency.gold { color: var(--gold); }
.currency.up   { color: var(--up); }
.currency.dim  { color: var(--text3); }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* Flex utils */
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.flex1 { flex: 1; }

/* Grid utils */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* Mono */
.mono { font-family: var(--font-mono); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

/* Glowing elements */
.glow-cyan { box-shadow: 0 0 30px rgba(0,212,255,.2); }
.glow-text { text-shadow: 0 0 20px rgba(0,212,255,.4); }

.auth-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(ellipse at 30% 40%, rgba(0,212,255,.04) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(0,102,255,.03) 0%, transparent 50%); }
.auth-bg::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300D4FF' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
.auth-card { width: 100%; max-width: 420px; margin: 0 24px; position: relative; z-index: 1; }
.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo .logo-text { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; color: #F0F4FF; letter-spacing: -.03em; }
.auth-logo .logo-text span { color: #00D4FF; }
.auth-logo .logo-sub { font-size: 12px; color: #4A5568; font-family: 'JetBrains Mono', monospace; margin-top: 4px; letter-spacing: .1em; }
.auth-box { background: #111520; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 32px; box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(0,212,255,.05); }

/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg: #F0F4FF;
  --bg2: #E8EDF8;
  --surface: #FFFFFF;
  --surface2: #F5F7FF;
  --surface3: #EBF0FF;
  --border: rgba(0,0,0,.08);
  --border2: rgba(0,0,0,.12);
  --border3: rgba(0,0,0,.18);
  --text: #0D1117;
  --text2: #374151;
  --text3: #6B7280;
  --dim: #9CA3AF;
  --cyan: #0066CC;
  --cyan2: #0052A3;
  --cyan-dim: rgba(0,102,204,.08);
  --cyan-glow: rgba(0,102,204,.12);
}
[data-theme="light"] .sidebar { background: #E8EDF8; }

// ── PRICE SYSTEM ───────────────────────────────────────────
function parseCardKey(k) {
  const m=k.match(/^(.+)_(\d{4})$/);
  if(m&&YEAR_PRICE_MULT[parseInt(m[2])])return{id:m[1],year:parseInt(m[2])};
  return{id:k,year:2026};
}
function getBaseCard(k) { const {id}=parseCardKey(k);return CARD_BY_ID[id]||CARD_BY_ID[k]; }

function getCardPrice(save,k) {
  const {id,year}=parseCardKey(k);
  const card=CARD_BY_ID[id]||CARD_BY_ID[k];
  if(!card)return 0;
  const ym=YEAR_PRICE_MULT[year]||1.0;
  const vintageBase=Math.round(cardPrice(card)*ym);
  return save.cardPrices[k]||vintageBase;
}

function initPrices(save) {
  for(const card of CARDS){
    const keys=[card.id,...Object.keys(YEAR_PRICE_MULT).filter(y=>parseInt(y)<2026).map(y=>card.id+"_"+y)];
    for(const k of keys){
      const {year}=parseCardKey(k);
      const ym=YEAR_PRICE_MULT[year]||1.0;
      if(!save.cardPrices[k]){
        const base=cardPrice(card);
        save.cardPrices[k]=Math.round(base*ym*(0.92+Math.random()*0.16));
      }
      if(!save.priceHistory[k])save.priceHistory[k]=[save.cardPrices[k]];
    }
  }
  return save;
}

function tickMarket(save) {
  const vol={common:0.04,rare:0.06,epic:0.08,legendary:0.10,ultimate:0.14};
  for(const card of CARDS){
    const keys=[card.id,...Object.keys(YEAR_PRICE_MULT).filter(y=>parseInt(y)<2026).map(y=>card.id+"_"+y)];
    for(const k of keys){
      const {year}=parseCardKey(k);
      const ym=YEAR_PRICE_MULT[year]||1.0;
      const base=Math.round(cardPrice(card)*ym);
      const cur=save.cardPrices[k]||base;
      const v=vol[card.rarity]||0.05;
      const change=(Math.random()-.5)*2*v;
      const drift=(base-cur)/base*0.025;
      const newP=Math.max(Math.round(cur*(1+change+drift)),Math.round(base*0.3));
      save.cardPrices[k]=newP;
      const hist=save.priceHistory[k]||[base];
      hist.push(newP);if(hist.length>60)hist.shift();
      save.priceHistory[k]=hist;
    }
  }
  return save;
}

// ── OPEN PACK ──────────────────────────────────────────────
function openPack(pack,save,count=1) {
  const sz=PACK_SIZES.find(p=>p.cards===count)||PACK_SIZES[0];
  const totalPrice=Math.round(pack.basePrice*sz.mult);
  if(save.coins<totalPrice)return null;
  save.coins-=totalPrice;save.packsOpened++;save.totalSpent+=totalPrice;
  const results=[];
  const sportId=pack.id.split("_")[0];
  const season=parseInt(pack.id.split("_")[1])||2026;
  const pool=CARDS.filter(c=>c.sport===sportId);
  const byRarity={};for(const r of Object.keys(RARITY))byRarity[r]=pool.filter(c=>c.rarity===r);
  for(let i=0;i<count;i++){
    let rarity;
    const rarOrder=["common","rare","epic","legendary","ultimate"];
    if(i===0&&pack.guaranteed){
      const minIdx=rarOrder.indexOf(pack.guaranteed);
      const avail=rarOrder.slice(minIdx).filter(r=>(byRarity[r]||[]).length>0);
      const weights=avail.map(r=>pack.odds[r]||0);
      const total=weights.reduce((a,b)=>a+b,0);
      let rand=Math.random()*total;rarity=avail[0];
      for(let j=0;j<avail.length;j++){if(rand<weights[j]){rarity=avail[j];break;}rand-=weights[j];}
    } else {
      let rand=Math.random();rarity="common";
      for(const[r,prob]of Object.entries(pack.odds)){if(rand<prob&&(byRarity[r]||[]).length>0){rarity=r;break;}rand-=prob;}
    }
    const pool2=byRarity[rarity]||byRarity["common"]||CARDS;
    const card=pool2[Math.floor(Math.random()*pool2.length)];
    const cardKey=season<2026?card.id+"_"+season:card.id;
    const wasNew=!save.owned[cardKey];
    save.owned[cardKey]=(save.owned[cardKey]||0)+1;
    results.push({card:{...card,key:cardKey,season},rarity,isNew:wasNew});
  }
  addLog(save,"pack",`Відкрито "${pack.name}" (${count} карт.) — ${results.map(r=>r.card.name).join(", ")}`);
  writeSave(save);return results;
}

// ── MARKET ─────────────────────────────────────────────────
function sellCard(save,cardKey,qty=1) {
  if((save.owned[cardKey]||0)<qty)return false;
  const price=getCardPrice(save,cardKey);
  const card=getBaseCard(cardKey);
  const {year}=parseCardKey(cardKey);
  save.owned[cardKey]-=qty;
  if(save.owned[cardKey]===0)delete save.owned[cardKey];
  save.coins+=price*qty;save.totalEarned+=price*qty;save.cardsSold+=qty;
  const yt=year<2026?" ["+year+"]":"";
  addLog(save,"sell",`Продано ${qty}x ${card?.name}${yt} за ${fmtCoins(price*qty)} монет`);
  writeSave(save);return true;
}

function buyCard(save,cardKey,qty=1) {
  const price=getCardPrice(save,cardKey);
  const total=price*qty;
  const card=getBaseCard(cardKey);
  const {year}=parseCardKey(cardKey);
  if(save.coins<total)return false;
  save.coins-=total;
  save.owned[cardKey]=(save.owned[cardKey]||0)+qty;
  save.totalSpent+=total;save.cardsBought+=qty;
  const yt=year<2026?" ["+year+"]":"";
  addLog(save,"buy",`Куплено ${qty}x ${card?.name}${yt} за ${fmtCoins(total)} монет`);
  writeSave(save);return true;
}

// ── TRADES — ОБМЕЖЕННЯ ─────────────────────────────────────
function canTrade(save,myKey,botKey){
  const myCard=getBaseCard(myKey);const botCard=getBaseCard(botKey);
  if(!myCard||!botCard)return{ok:false,reason:"Картка не знайдена"};
  const myP=getCardPrice(save,myKey);const botP=getCardPrice(save,botKey);
  const ratio=Math.max(myP,botP)/Math.max(Math.min(myP,botP),1);
  if(ratio>5)return{ok:false,reason:`Різниця цін надто велика (${ratio.toFixed(1)}x)`};
  const rarOrder=["common","rare","epic","legendary","ultimate"];
  const myR=rarOrder.indexOf(myCard.rarity);const botR=rarOrder.indexOf(botCard.rarity);
  if(Math.abs(myR-botR)>1)return{ok:false,reason:"Рідкість карток надто відрізняється"};
  const now=Date.now();const windowMs=10*60*1000;
  if(!save.tradeWindow)save.tradeWindow={start:now,count:0};
  if(now-save.tradeWindow.start>windowMs)save.tradeWindow={start:now,count:0};
  if(save.tradeWindow.count>=50)return{ok:false,reason:"Ліміт 50 обмінів за 10 хв вичерпано"};
  const tradedCount=(save.tradedCards||{})[myKey]||0;
  if(tradedCount>=(save.owned[myKey]||0))return{ok:false,reason:"Ця картка вже була в обміні"};
  return{ok:true,reason:""};
}
function tradeCards(save,myKey,botKey){
  const check=canTrade(save,myKey,botKey);
  if(!check.ok)return{success:false,reason:check.reason};
  if((save.owned[myKey]||0)<1)return{success:false,reason:"Немає цієї картки"};
  save.owned[myKey]--;if(save.owned[myKey]===0)delete save.owned[myKey];
  save.owned[botKey]=(save.owned[botKey]||0)+1;
  save.tradesDone++;
  if(!save.tradedCards)save.tradedCards={};
  save.tradedCards[myKey]=(save.tradedCards[myKey]||0)+1;
  if(!save.tradeWindow)save.tradeWindow={start:Date.now(),count:0};
  save.tradeWindow.count++;
  const mc=getBaseCard(myKey);const bc=getBaseCard(botKey);
  addLog(save,"trade",`Обмін: ${mc?.name} → ${bc?.name}`);
  writeSave(save);return{success:true,reason:""};
}
function generateBotOffer(save,myKey){
  const now=Date.now();const cacheMs=10*60*1000;
  if(!save.botOffers)save.botOffers={};
  const cache=save.botOffers[myKey];
  if(!cache||now-cache.ts>cacheMs){
    const count=10+Math.floor(Math.random()*11);
    const myP=getCardPrice(save,myKey);const myCard=getBaseCard(myKey);
    const rarOrder=["common","rare","epic","legendary","ultimate"];
    const myR=rarOrder.indexOf(myCard?.rarity||"common");
    const candidates=CARDS.filter(c=>{
      if(c.id===parseCardKey(myKey).id)return false;
      const cR=rarOrder.indexOf(c.rarity);if(Math.abs(cR-myR)>1)return false;
      const cP=getCardPrice(save,c.id);
      return Math.max(myP,cP)/Math.max(Math.min(myP,cP),1)<=5;
    });
    const pool=candidates.length?candidates:CARDS;
    const shuffled=pool.slice().sort(()=>Math.random()-.5).slice(0,count);
    save.botOffers[myKey]={ts:now,offers:shuffled.map(c=>c.id),idx:0};
    writeSave(save);
  }
  const oc=save.botOffers[myKey];
  return CARD_BY_ID[oc.offers[oc.idx%oc.offers.length]]||CARDS[0];
}
function nextBotOffer(save,myKey){
  if(!save.botOffers||!save.botOffers[myKey])return generateBotOffer(save,myKey);
  save.botOffers[myKey].idx=(save.botOffers[myKey].idx||0)+1;
  const oc=save.botOffers[myKey];
  writeSave(save);
  return CARD_BY_ID[oc.offers[oc.idx%oc.offers.length]]||CARDS[0];
}

// ── MARKET ─────────────────────────────────────────────────
function sellCard(save,cardKey,qty=1) {
  if((save.owned[cardKey]||0)<qty)return false;
  const price=getCardPrice(save,cardKey);
  const card=getBaseCard(cardKey);
  const {year}=parseCardKey(cardKey);
  save.owned[cardKey]-=qty;
  if(save.owned[cardKey]===0)delete save.owned[cardKey];
  save.coins+=price*qty;save.totalEarned+=price*qty;save.cardsSold+=qty;
  const yt=year<2026?" ["+year+"]":"";
  addLog(save,"sell",`Продано ${qty}x ${card?.name}${yt} за ${fmtCoins(price*qty)} монет`);
  writeSave(save);return true;
}

function buyCard(save,cardKey,qty=1) {
  const price=getCardPrice(save,cardKey);
  const total=price*qty;
  const card=getBaseCard(cardKey);
  const {year}=parseCardKey(cardKey);
  if(save.coins<total)return false;
  save.coins-=total;
  save.owned[cardKey]=(save.owned[cardKey]||0)+qty;
  save.totalSpent+=total;save.cardsBought+=qty;
  const yt=year<2026?" ["+year+"]":"";
  addLog(save,"buy",`Куплено ${qty}x ${card?.name}${yt} за ${fmtCoins(total)} монет`);
  writeSave(save);return true;
}

// ── TRADES — ОБМЕЖЕННЯ ─────────────────────────────────────
function canTrade(save,myKey,botKey){
  const myCard=getBaseCard(myKey);const botCard=getBaseCard(botKey);
  if(!myCard||!botCard)return{ok:false,reason:"Картка не знайдена"};
  const myP=getCardPrice(save,myKey);const botP=getCardPrice(save,botKey);
  const ratio=Math.max(myP,botP)/Math.max(Math.min(myP,botP),1);
  if(ratio>5)return{ok:false,reason:`Різниця цін надто велика (${ratio.toFixed(1)}x)`};
  const rarOrder=["common","rare","epic","legendary","ultimate"];
  const myR=rarOrder.indexOf(myCard.rarity);const botR=rarOrder.indexOf(botCard.rarity);
  if(Math.abs(myR-botR)>1)return{ok:false,reason:"Рідкість карток надто відрізняється"};
  const now=Date.now();const windowMs=10*60*1000;
  if(!save.tradeWindow)save.tradeWindow={start:now,count:0};
  if(now-save.tradeWindow.start>windowMs)save.tradeWindow={start:now,count:0};
  if(save.tradeWindow.count>=50)return{ok:false,reason:"Ліміт 50 обмінів за 10 хв вичерпано"};
  const tradedCount=(save.tradedCards||{})[myKey]||0;
  if(tradedCount>=(save.owned[myKey]||0))return{ok:false,reason:"Ця картка вже була в обміні"};
  return{ok:true,reason:""};
}
function tradeCards(save,myKey,botKey){
  const check=canTrade(save,myKey,botKey);
  if(!check.ok)return{success:false,reason:check.reason};
  if((save.owned[myKey]||0)<1)return{success:false,reason:"Немає цієї картки"};
  save.owned[myKey]--;if(save.owned[myKey]===0)delete save.owned[myKey];
  save.owned[botKey]=(save.owned[botKey]||0)+1;
  save.tradesDone++;
  if(!save.tradedCards)save.tradedCards={};
  save.tradedCards[myKey]=(save.tradedCards[myKey]||0)+1;
  if(!save.tradeWindow)save.tradeWindow={start:Date.now(),count:0};
  save.tradeWindow.count++;
  const mc=getBaseCard(myKey);const bc=getBaseCard(botKey);
  addLog(save,"trade",`Обмін: ${mc?.name} → ${bc?.name}`);
  writeSave(save);return{success:true,reason:""};
}
function generateBotOffer(save,myKey) {
  const myPrice=getCardPrice(save,myKey);
  const myCard=getBaseCard(myKey);
  if(!myCard)return CARDS[0];
  const myRarOrder=["common","rare","epic","legendary","ultimate"];
  const myRIdx=myRarOrder.indexOf(myCard.rarity);
  // Тільки картки схожої рідкості (±1 рівень) і ціни (до 3x різниці)
  const candidates=CARDS.filter(c=>{
    const rIdx=myRarOrder.indexOf(c.rarity);
    if(Math.abs(rIdx-myRIdx)>1)return false;
    const p=getCardPrice(save,c.id);
    const ratio=Math.max(myPrice,p)/Math.max(Math.min(myPrice,p),1);
    return ratio<=3&&c.id!==myCard.id;
  });
  if(!candidates.length)return CARDS.filter(c=>c.rarity===myCard.rarity)[0]||CARDS[0];
  return candidates[Math.floor(Math.random()*candidates.length)];
}

// ── UTILS ─────────────────────────────────────────────────
function addLog(save,type,text) {
  const now=new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  save.log.unshift({type,text,time:now,date:new Date().toISOString()});
  if(save.log.length>200)save.log.pop();
}
function netWorth(save) {
  let w=save.coins;
  for(const[k,qty]of Object.entries(save.owned||{}))w+=getCardPrice(save,k)*qty;
  return w;
}
function fmtCoins(n){const v=Number(n||0);if(v>=1000000)return "$"+(v/1000000).toFixed(2)+"M";return "$"+v.toLocaleString("en-US");}
function toast(msg,type="info"){
  const root=document.getElementById("toast-root");if(!root)return;
  const icons={info:"💬",win:"✅",lose:"❌",warn:"⚠️"};
  const el=document.createElement("div");el.className=`toast toast-${type}`;
  el.innerHTML=`<span class="toast-icon">${icons[type]||"💬"}</span><span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),350);},3500);
}
function openModal(id){document.getElementById(id)?.classList.add("open");}
function closeModal(id){document.getElementById(id)?.classList.remove("open");}
function initNav(activePage){
  document.querySelectorAll(".nav-item[href]").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===activePage));
  const av=document.getElementById("tb-avatar");
  if(av){av.textContent=Account.initials();av.onclick=()=>location.href="account.html";}
  function tick(){const el=document.getElementById("tb-clock");if(el)el.textContent=new Date().toLocaleTimeString("uk-UA");}
  tick();setInterval(tick,1000);
  Account.applyTheme();updateCoinsDisplay();
}
function updateCoinsDisplay(){
  const s=loadSave();const el=document.getElementById("tb-coins");
  if(el)el.textContent=fmtCoins(s.coins);
}
</script>

<script>

// Mobile navigation drawer — desktop appearance stays unchanged.
(function(){
  const sidebar=document.querySelector('.sidebar');
  const topbar=document.querySelector('.topbar');
  if(!sidebar||!topbar)return;
  if(!topbar.querySelector('.mobile-nav-toggle')){
    const btn=document.createElement('button');
    btn.className='mobile-nav-toggle';btn.type='button';btn.setAttribute('aria-label','Відкрити меню');btn.textContent='☰';
    topbar.insertBefore(btn,topbar.firstChild);
    const bd=document.createElement('div');bd.className='mobile-nav-backdrop';document.body.appendChild(bd);
    const close=()=>{sidebar.classList.remove('mobile-open');bd.classList.remove('open');};
    btn.addEventListener('click',()=>{sidebar.classList.toggle('mobile-open');bd.classList.toggle('open',sidebar.classList.contains('mobile-open'));});
    bd.addEventListener('click',close);
    sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
    window.addEventListener('resize',()=>{if(innerWidth>760)close();},{passive:true});
  }
})();

</script>
